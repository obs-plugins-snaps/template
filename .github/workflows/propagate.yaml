# Propagate template updates to plugin repositories.

# Runs after the auto-tag workflow completes on main: when a new template
# tag exists, open one update PR per managed plugin repository so their
# scaffolding follows the template.
#
# The list of managed plugins is read from meta at runtime: every
# plugins/<plugin_name>-obs-studio.json record in
# https://github.com/obs-plugins-snaps/meta maps to the repository
# <plugin_name>-obs-studio-snap. meta is the single source of truth; this
# workflow never edits it.

name: Propagate template updates

"on":
  workflow_run:
    workflows: [Tag commit]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Template tag to propagate (defaults to the latest v* tag)
        required: false

concurrency:
  group: propagate-template
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  propagate:
    name: Open update PRs on plugin repositories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # copier update needs the history around the recorded _commit.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Configure git commit signing
        env:
          CI_SSH_SIGNING_KEY: ${{ secrets.CI_SSH_SIGNING_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$CI_SSH_SIGNING_KEY" > ~/.ssh/signing-key
          chmod 600 ~/.ssh/signing-key
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing-key
          git config --global commit.gpgsign true

      - name: Generate installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve the latest template tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(gh api "repos/$GITHUB_REPOSITORY/tags" \
            --jq '[.[].name | select(startswith("v"))][0]')
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: List plugin records in meta
        id: plugins
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          names=$(gh api "repos/$GITHUB_REPOSITORY_OWNER/meta/contents/plugins" \
            --jq '[.[].name | select(endswith("-obs-studio.json")) |
                   capture("(?<p>.+)-obs-studio\\.json").p]')
          echo "plugins=$names" >> "$GITHUB_OUTPUT"

      - name: Open update PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TEMPLATE_TAG: ${{ steps.tag.outputs.version }}
          PLUGINS: ${{ steps.plugins.outputs.plugins }}
        run: |
          uvx --from copier copier --version
          uv run .github/scripts/propagate.py \
            --tag "$TEMPLATE_TAG" \
            --plugins "$PLUGINS" \
            --summary "$GITHUB_STEP_SUMMARY"
