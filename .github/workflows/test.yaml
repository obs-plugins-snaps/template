name: Test template

on:
  pull_request:
    paths:
      - "copier.yaml"
      - "template/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    branches: [main]

jobs:
  test:
    name: Test template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Run tests
        run: uv run pytest tests/ -v
