[dependency-groups]
dev = [
    "pytest",
    "pytest-copie",
    "pyyaml",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
show-fixes = true

[tool.ruff.lint]
select = [
    "F",  # Pyflakes
    "E",  # Pycodestyle
    "W",  # Pycodestyle
    "D",  # Pydocstyle
    "UP",  # pyupgrade
    "I",  # isort
    "PL",  # Pylint
]
ignore = [
    "D203",  # incorrect-blank-line-before-class (prefer D211: no-blank-line-before-class)
    "D213",  # multi-line-summary-second-line (prefer D212: multi-line-summary-first-line)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D", "PLR2004"]
